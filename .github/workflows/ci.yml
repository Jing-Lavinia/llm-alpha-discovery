name: public-evidence-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install evidence package
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Validate aggregate evidence
        run: alpha-evidence evidence evidence/aggregate-evidence.v3.json
      - name: Verify released artifacts
        run: alpha-evidence manifest evidence/release-manifest.v1.json --allowlist evidence/release-allowlist.txt
